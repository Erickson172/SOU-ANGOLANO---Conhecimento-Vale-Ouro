<body>

<!-- IMAGEM -->
<img src="topo.png" class="topo-img">

<!-- CONTADOR -->
<div class="contador-box">
    <div>TEMPO LIMITADO</div>
    <div id="contador">03:50</div>
</div>

<!-- CHECKOUT -->
<div class="checkout-container">
    <iframe src="https://pay.clickpayon.com/fb566e9d-e3a2-4649-94a9-4d90c520290d?utm_source=organic&amp;utm_campaign=&amp;utm_medium=&amp;utm_content=&amp;utm_term=" allowfullscreen="">
    </iframe>
</div>

<script>
let tempo = 300; // 5 minutos

const contador = document.getElementById("contador");

const intervalo = setInterval(() => {

    const minutos = Math.floor(tempo / 60);
    const segundos = tempo % 60;

    contador.textContent =
        String(minutos).padStart(2, "0") + ":" +
        String(segundos).padStart(2, "0");

    tempo--;

    if (tempo < 0) {
        clearInterval(intervalo);
        contador.textContent = "00:00";
    }

}, 1000);
</script>
