</div>

</div>
</div>

<!-- MULTICAIXA -->
<div id="opcaoMulticaixa" class="opcao-deposito border-4 border-zinc-900 p-8 rounded-[2.5rem] transition-all">
<div class="flex justify-between items-center">
<div>
<p class="font-black text-xl">🏧 MULTICAIXA EXPRESS</p>
<p class="text-[10px] text-zinc-500 font-bold uppercase mt-1">
Levantamento sem cartão
</p>
</div>

</div>
</div>

</div>

<!-- 🔥 BOTÃO BANCO (SÓ APARECE SE SELECIONAR BANCO) -->
<button id="btnBanco" onclick="window.location.href='rede-bancária.html'" style="display:none; background:linear-gradient(135deg,#F8D308,#D4AF37,#F8D308); color:#000;" class="w-full py-7 font-black rounded-[2.5rem] uppercase text-xl transition-all">

</button>

<!-- 🔥 BOTÃO MULTICAIXA (SÓ APARECE SE SELECIONAR MULTICAIXA) -->
<button id="btnMulticaixa" onclick="window.location.href='finalizar-dados-express.html'" style="display:none; background:linear-gradient(135deg,#F8D308,#D4AF37,#F8D308); color:#000;" class="w-full py-7 font-black rounded-[2.5rem] uppercase text-xl transition-all mt-4">

</div>
</div>
</main>
</div>

<!-- 🔥 SCRIPT ADICIONADO (NÃO ALTERA NADA DO SEU SITE) -->
<script>
const banco = document.getElementById("opcaoBanco");
const multicaixa = document.getElementById("opcaoMulticaixa");
const btnBanco = document.getElementById("btnBanco");
const btnMulticaixa = document.getElementById("btnMulticaixa");

banco.addEventListener("click", () => {
    banco.classList.add("selecionado");
    multicaixa.classList.remove("selecionado");
    btnBanco.style.display = "block";
    btnMulticaixa.style.display = "none";
});

multicaixa.addEventListener("click", () => {
    multicaixa.classList.add("selecionado");
    banco.classList.remove("selecionado");
    btnMulticaixa.style.display = "block";
    btnBanco.style.display = "none";
});
</script>
