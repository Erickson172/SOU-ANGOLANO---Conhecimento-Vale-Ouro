    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        :root {
            --pink: #ff174f;

            --gold: linear-gradient(
                135deg,
                #F8D308,
                #D4AF37,
                #F8D308
            );
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .titulo-topo {
            width: 100%;
            text-align: center;
            padding: 25px 15px 20px;
        }

        .titulo-topo h2 {
            color: #dc2626;
            font-size: clamp(22px, 3vw, 52px);
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
        }


        /* =====================================
           CONTAINER
        ===================================== */

        .live-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px 30px;
        }

        .live-wrapper {
            width: 100%;
            max-width: 1500px;
        }


        /* =====================================
           BARRA SUPERIOR
           FICA ACIMA DO VÍDEO
        ===================================== */

        .live-topbar {
            width: 100%;
            min-height: 82px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 10px 5px 15px;
        }


        /* ESQUERDA */

        .top-left-group {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .avatar-principal {
            width: 58px;
            height: 58px;

            border-radius: 50%;
            overflow: hidden;

            border: 2px solid rgba(255,255,255,.9);

            flex-shrink: 0;
            background: #111;
        }

        .avatar-principal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            white-space: nowrap;
        }

        .profile-name {
            font-size: clamp(16px, 1.8vw, 29px);
            font-weight: 800;
        }

        .profile-likes {
            color: #cfcfcf;
            font-size: clamp(12px, 1.3vw, 20px);
        }


        /* BOTÃO SEGUIR */

        .follow-btn {
            border: none;

            background: #ff174f;
            color: #fff;

            padding: 13px 25px;

            border-radius: 50px;

            font-size: clamp(14px, 1.5vw, 22px);
            font-weight: 800;

            cursor: pointer;

            transition: .25s;
            white-space: nowrap;
        }

        .follow-btn:hover {
            transform: scale(1.05);
        }

        .follow-btn.following {
            background: #333;
            color: #ddd;
        }


        /* =====================================
           TOPO DIREITO
        ===================================== */

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatars-live {
            display: flex;
            align-items: center;
            padding-left: 8px;
        }

        .mini-avatar {
            width: 45px;
            height: 45px;

            border-radius: 50%;
            overflow: hidden;

            margin-left: -10px;

            border: 2px solid #eab308;

            background: #222;
        }

        .mini-avatar:first-child {
            margin-left: 0;
        }

        .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .viewer-count {
            font-size: clamp(16px, 1.7vw, 26px);
            font-weight: 700;
            white-space: nowrap;
        }

        .close-live {
            font-size: clamp(35px, 3vw, 55px);
            font-weight: 200;
            cursor: pointer;
            line-height: 1;
        }


        /* =====================================
           VÍDEO RETANGULAR
        ===================================== */

        .live-screen {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            background: #000;

            overflow: hidden;

            /* LINHAS RECTAS */
            border-radius: 0;

            box-shadow:
                0 0 0 1px rgba(255,255,255,.08),
                0 20px 60px rgba(0,0,0,.8);
        }


        /* VÍDEO */

        .video-background {
            position: absolute;
            inset: 0;

            z-index: 1;

            width: 100%;
            height: 100%;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;

            border: none;
            display: block;
        }


        /* SOMBRAS */

        .live-screen::before {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                linear-gradient(
                    180deg,
                    rgba(0,0,0,.48),
                    transparent 24%
                ),

                linear-gradient(
                    0deg,
                    rgba(0,0,0,.42),
                    transparent 25%
                ),

                linear-gradient(
                    90deg,
                    rgba(0,0,0,.30),
                    transparent 35%,
                    transparent 70%,
                    rgba(0,0,0,.12)
                );
        }


        /* =====================================
           INTERFACE DO VÍDEO
        ===================================== */

        .live-ui {
            position: absolute;
            inset: 0;

            z-index: 3;

            pointer-events: none;
        }


        /* =====================================
           RANKING
        ===================================== */

        .ranking {
            position: absolute;

            top: 3%;
            left: 1.5%;

            background: rgba(0,0,0,.78);

            backdrop-filter: blur(15px);

            padding: 9px 17px;

            border-radius: 50px;

            font-size: clamp(11px, 1.1vw, 18px);
            font-weight: 700;

            box-shadow:
                0 5px 20px rgba(0,0,0,.3);
        }


        /* =====================================
           EXPLORAR
        ===================================== */

        .explore {
            position: absolute;

            top: 3%;
            right: 1.5%;

            background: rgba(0,0,0,.72);

            backdrop-filter: blur(15px);

            padding: 9px 17px;

            border-radius: 50px;

            font-size: clamp(11px, 1.1vw, 18px);
            font-weight: 700;
        }


        /* =====================================
           LIVE BADGE
        ===================================== */

        .live-badge {
            position: absolute;

            top: 14%;
            right: 1.5%;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px 17px;

            background: rgba(8,8,12,.90);

            backdrop-filter: blur(20px);

            border-radius: 14px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.5);
        }

        .live-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .live-text strong {
            font-size: clamp(13px, 1.5vw, 23px);
        }

        .live-text span {
            color: #ddd;
            font-size: clamp(10px, 1.1vw, 17px);
        }

        .tiktok-symbol {
            font-size: clamp(28px, 3vw, 48px);
        }


        /* =====================================
           COMENTÁRIOS
        ===================================== */

        .comments {
            position: absolute;

            /* MAIS À ESQUERDA */
            left: 1.5%;

            /* SOBEM APENAS ATÉ AO MEIO */
            bottom: 6%;
            width: 43%;
            max-height: 48%;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .comment {
            display: flex;
            align-items: flex-start;

            opacity: 0;

            transform: translateY(18px);

            animation:
                commentAppear .5s ease forwards;
        }

        .comment-body {
            display: flex;
            flex-direction: column;
            gap: 2px;

            width: 100%;
        }

        .comment-name {
            color: #cfcfcf;

            font-size: clamp(10px, 1.1vw, 17px);

            font-weight: 600;
        }

        .comment-message {
            color: #fff;

            font-size: clamp(11px, 1.25vw, 20px);

            font-weight: 500;

            line-height: 1.18;

            text-shadow:
                0 2px 8px rgba(0,0,0,.95);
        }

        @keyframes commentAppear {

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .comment.removing {

            animation:
                commentRemove .4s ease forwards;

        }

        @keyframes commentRemove {

            to {
                opacity: 0;
                transform: translateX(-30px);
            }

        }


        /* =====================================
           AÇÕES LATERAIS
        ===================================== */

        .right-actions {
            position: absolute;

            right: 1.5%;
            top: 40%;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 12px;

            pointer-events: auto;
        }

        .side-action {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background: rgba(0,0,0,.35);

            backdrop-filter: blur(10px);

            font-size: clamp(23px, 2.5vw, 40px);

            cursor: pointer;

            transition: .2s;
        }

        .side-action:hover {
            transform: scale(1.12);
        }


        /* =====================================
           CORAÇÕES / PRESENTES / ROSAS
        ===================================== */

        .hearts-container {
            position: absolute;

            right: 1.5%;
            bottom: 4%;

            width: 100px;
            height: 70%;

            overflow: hidden;

            pointer-events: none;
        }

        .heart {
            position: absolute;

            bottom: 0;

            font-size: clamp(25px, 3vw, 55px);

            animation:
                heartFloat 4s linear forwards;

            filter:
                drop-shadow(
                    0 5px 10px
                    rgba(0,0,0,.5)
                );
        }

        @keyframes heartFloat {

            0% {
                transform:
                    translateY(0)
                    scale(.5);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-500px)
                    translateX(var(--move))
                    scale(1.3);

                opacity: 0;
            }

        }


        /* =====================================
           BARRA INFERIOR
        ===================================== */

        .live-bottom-bar {
            width: 100%;

            display: flex;
            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 14px 5px 5px;
        }

        .comment-input {
            width: 58%;

            border: none;
            outline: none;

            background:
                linear-gradient(
                    90deg,
                    #252525,
                    #161616
                );

            color: #fff;

            padding: 17px 24px;

            border-radius: 50px;

            font-size: clamp(13px, 1.4vw, 21px);
        }

        .comment-input::placeholder {
            color: #aaa;
        }


        /* AÇÕES INFERIORES */

        .bottom-actions {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: clamp(12px, 2.8vw, 45px);

            flex: 1;
        }

        .bottom-action {
            border: none;
            background: transparent;

            color: #ddd;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 4px;

            cursor: pointer;

            font-family: inherit;

            transition: .2s;
        }

        .bottom-action:hover {
            transform: translateY(-4px);
        }

        .bottom-icon {
            font-size: clamp(27px, 3vw, 43px);
            line-height: 1;
        }

        .bottom-action span {
            font-size: clamp(9px, 1vw, 16px);
        }


        /* =====================================
           BOTÃO DELAY
        ===================================== */

        #btnDelay {

            display: none;

            width: calc(100% - 30px);
            max-width: 1000px;

            margin: 35px auto 50px;

            padding: 22px 30px;

            border: none;

            border-radius: 50px;

            background: var(--gold);

            color: #000;

            font-size: clamp(17px, 2vw, 27px);

            font-weight: 900;

            text-transform: uppercase;

            cursor: pointer;

            box-shadow:
                0 15px 40px
                rgba(212,175,55,.25);
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

        }


        /* =====================================
           TABLET
        ===================================== */

        @media(max-width: 900px) {

            .live-topbar {
                gap: 10px;
            }

            .top-right-group {
                gap: 10px;
            }

            .mini-avatar {
                width: 34px;
                height: 34px;
            }

            .avatar-principal {
                width: 46px;
                height: 46px;
            }

            .follow-btn {
                padding: 10px 16px;
            }

            .comments {
                width: 48%;
                max-height: 46%;
            }

            .side-action {
                width: 44px;
                height: 44px;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media(max-width: 650px) {

            .titulo-topo {
                padding: 15px 10px;
            }

            .live-container {
                padding: 0 5px 20px;
            }

            .live-topbar {
                padding: 8px 3px 10px;
                gap: 6px;
            }

            .profile-name {
                font-size: 12px;
            }

            .profile-likes {
                font-size: 9px;
            }

            .avatar-principal {
                width: 34px;
                height: 34px;
            }

            .follow-btn {
                padding: 8px 10px;
                font-size: 10px;
            }

            .mini-avatar {
                width: 24px;
                height: 24px;
                margin-left: -6px;
            }

            .viewer-count {
                font-size: 11px;
            }

            .close-live {
                font-size: 28px;
            }

            .ranking,
            .explore {
                padding: 6px 9px;
                font-size: 8px;
            }

            .live-badge {
                top: 14%;
                padding: 7px 9px;
                gap: 5px;
            }

            .live-text strong {
                font-size: 8px;
            }

            .live-text span {
                font-size: 6px;
            }

            .tiktok-symbol {
                font-size: 20px;
            }

            .comments {
                left: 2%;
                width: 55%;
                bottom: 5%;
                max-height: 45%;
                gap: 5px;
            }

            .comment-name {
                font-size: 7px;
            }

            .comment-message {
                font-size: 8px;
            }

            .right-actions {
                right: 1%;
                top: 40%;
                gap: 5px;
            }

            .side-action {
                width: 29px;
                height: 29px;
                font-size: 17px;
            }

            .live-bottom-bar {
                gap: 7px;
                padding-top: 9px;
            }

            .comment-input {
                width: 45%;
                padding: 10px 12px;
                font-size: 9px;
            }

            .bottom-actions {
                gap: 9px;
            }

            .bottom-icon {
                font-size: 20px;
            }

            .bottom-action span {
                font-size: 6px;
            }

        }

    </style>

</head>

        /* =====================================

        ===================================== */

        const comments = [

                message: "Meu Deus! Eu realmente recebi os 100 mil! 😭🔥"
            },

            },

            },

            },

            {

            },

            {
                name: "lucas_ao",
                message: "Isso mudou completamente a minha opinião. Eu era um dos que não acreditava."
            },

            {

                name: "fernanda_kz",
                message: "Obrigado pela oportunidade! Os 100 mil já estão na minha conta. 🙏🏽"

        ];


        let commentIndex = 0;

        const commentsContainer =
            document.getElementById(
                "commentsContainer"
            );


        function addComment() {

            const data = comments[commentIndex];

            const comment =
                document.createElement("div");

            comment.className = "comment";

            comment.innerHTML = `
                <div class="comment-body">

                    <div class="comment-name">
                        ${data.name}
                    </div>

                    <div class="comment-message">
                        ${data.message}
                    </div>

                </div>
            `;

            commentsContainer.appendChild(comment);


            /* MANTÉM APENAS 5 */

            if (commentsContainer.children.length > 5) {

                const firstComment =
                    commentsContainer.firstElementChild;

                firstComment.classList.add("removing");

                setTimeout(function () {

                    firstComment.remove();

                }, 400);

            }


            commentIndex++;

            if (commentIndex >= comments.length) {
                commentIndex = 0;
            }

        }


        setTimeout(addComment, 1000);

        setInterval(addComment, 3500);



        /* =====================================
           BOTÃO SEGUIR
        ===================================== */

        const followBtn =
            document.getElementById("followBtn");


        followBtn.addEventListener(
            "click",
            function () {

                if (
                    this.classList.contains("following")
                ) {

                    this.classList.remove("following");

                    this.textContent = "+ Seguir";

                } else {

                    this.classList.add("following");

                    this.textContent = "✓ Seguindo";

                }

            }
        );



        /* =====================================
           ESPECTADORES
        ===================================== */

        const viewerCount =
            document.getElementById("viewerCount");

        let viewers = 2300;


        function updateViewers() {

            const variation =
                Math.floor(Math.random() * 180) - 60;

            viewers += variation;


            if (viewers < 2100) {
                viewers = 2100;
            }


            if (viewers > 4800) {
                viewers = 4800;
            }


            viewerCount.textContent =

                viewers >= 1000

                    ? (viewers / 1000)
                        .toFixed(1)
                        .replace(".0", "") + "K"

                    : viewers;

        }


        setInterval(updateViewers, 2500);



        /* =====================================
           CURTIDAS
        ===================================== */

        const likesCount =
            document.getElementById("likesCount");

        let likes = 3200;


        function updateLikes() {

            likes +=
                Math.floor(Math.random() * 25) + 5;


            likesCount.textContent =

                likes >= 1000

                    ? (likes / 1000)
                        .toFixed(1)
                        .replace(".0", "") + "K"

                    : likes;

        }


        setInterval(updateLikes, 4000);



        /* =====================================
           CORAÇÕES
        ===================================== */

        const heartsContainer =
            document.getElementById("heartsContainer");


        const heartEmojis = [
            "❤️",
            "💕",
            "💗",
            "💖",
            "❤️"
        ];


        function createFloatingItem(emoji) {

            const item =
                document.createElement("div");

            item.className = "heart";


            item.textContent = emoji;


            item.style.left =
                Math.random() * 50 + "px";


            const randomMove =
                (Math.random() * 100 - 50) + "px";


            item.style.setProperty(
                "--move",
                randomMove
            );


            heartsContainer.appendChild(item);


            setTimeout(function () {

                item.remove();

            }, 4000);

        }


        function createHeart() {

            const emoji =
                heartEmojis[
                    Math.floor(
                        Math.random() *
                        heartEmojis.length
                    )
                ];

            createFloatingItem(emoji);

        }


        setInterval(createHeart, 1000);


        document
            .getElementById("heartButton")
            .addEventListener(
                "click",
                function () {

                    createHeart();
                    createHeart();
                    createHeart();

                }
            );



        /* =====================================
           ROSA
        ===================================== */

        document
            .getElementById("roseButton")
            .addEventListener(
                "click",
                function () {

                    for (let i = 0; i < 5; i++) {

                        setTimeout(
                            function () {
                                createFloatingItem("🌹");
                            },
                            i * 150
                        );

                    }

                }
            );



        /* =====================================
           PRESENTE
        ===================================== */

        document
            .getElementById("giftButton")
            .addEventListener(
                "click",
                function () {

                    createFloatingItem("🎁");

                }
            );



        /* =====================================
           PARTILHAR
        ===================================== */

        async function shareLive() {

            if (navigator.share) {

                try {

                    await navigator.share({

                        title:
                            "Sou Angolano - LIVE",

                        text:
                            "Assista esta LIVE!",

                        url:
                            window.location.href

                    });

                } catch (error) {

                    console.log(
                        "Partilha cancelada"
                    );

                }

            } else {

                try {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    alert(
                        "Link copiado para partilhar!"
                    );

                } catch (error) {

                    alert(
                        "Copie o link da página para partilhar."
                    );

                }

            }

        }


        document
            .getElementById("shareButton")
            .addEventListener(
                "click",
                shareLive
            );


        document
            .getElementById("sideShareButton")
            .addEventListener(
                "click",
                shareLive
            );



        /* =====================================
           DELAY DO BOTÃO

           220000ms = 3min40seg
        ===================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const botao =
                    document.getElementById(
                        "btnDelay"
                    );


                const tempoDelay = 220000;


                setTimeout(
                    function () {

                        botao.style.display = "block";

                        botao.classList.add(
                            "animate-bounce"
                        );

                    },
                    tempoDelay
                );

            }
        );


    </script>

</body>

</html>
